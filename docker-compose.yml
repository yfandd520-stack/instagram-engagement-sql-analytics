services:
  mysql:
    image: mysql:8.0
    container_name: instagram-engagement-mysql
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-portfolio_dev}
    ports:
      - "${MYSQL_PORT:-3307}:3306"
    healthcheck:
      test:
        [
          "CMD",
          "mysqladmin",
          "ping",
          "-h",
          "localhost",
          "-uroot",
          "-p${MYSQL_ROOT_PASSWORD:-portfolio_dev}",
        ]
      interval: 5s
      timeout: 5s
      retries: 20
